name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Every build has a unique version: the run number is the patch number, and the prerelease
      # suffix carries the commit. See the versioning notes in Directory.Build.props.
      - name: Set version properties
        shell: bash
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "VERSION_PROPERTIES=-p:BuildNumber=${{ github.run_number }} -p:CommitId=g${sha::7}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Atlassian.Mcp.Server.sln

      - name: Build
        run: dotnet build Atlassian.Mcp.Server.sln --configuration Release --no-restore ${{ env.VERSION_PROPERTIES }}

      - name: Test
        run: dotnet test Atlassian.Mcp.Server.sln --configuration Release --no-build --filter "TestCategory!=Integration"

      # The NuGet package, and a zip of the published server for running it without NuGet. The zip
      # has no native launcher, so the same file runs on every OS: dotnet Atlassian.Mcp.Server.dll.
      - name: Pack and zip
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet pack src/Atlassian.Mcp.Server --configuration Release --no-build ${{ env.VERSION_PROPERTIES }}
          version=$(basename "$(ls artifacts/*.nupkg | head -n 1)" .nupkg | sed 's/^Atlassian\.Mcp\.Server\.//')
          dotnet publish src/Atlassian.Mcp.Server --configuration Release --no-build ${{ env.VERSION_PROPERTIES }} -p:UseAppHost=false --output publish
          (cd publish && zip -r -q "../artifacts/Atlassian.Mcp.Server.$version.zip" .)

      - name: Upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: package
          path: |
            artifacts/*.nupkg
            artifacts/*.zip
          if-no-files-found: error

  prerelease:
    name: Publish the GitHub pre-release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: package
          path: artifacts

      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ github.token }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish the pre-release
        shell: bash
        run: |
          package=$(ls artifacts/*.nupkg | head -n 1)
          version=$(basename "$package" .nupkg | sed 's/^Atlassian\.Mcp\.Server\.//')
          tag="v$version"

          gh release create "$tag" "$package" artifacts/*.zip --prerelease --latest=false --title "$tag" --generate-notes --target "$GITHUB_SHA"
          echo "Published the GitHub pre-release $tag. Run the Publish workflow to push it to NuGet or to release it." >> "$GITHUB_STEP_SUMMARY"
