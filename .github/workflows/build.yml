name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Every build has a unique version: the run number is the patch number, and prerelease
      # versions also carry the commit. See the versioning notes in Directory.Build.props.
      - name: Set version properties
        shell: bash
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "VERSION_PROPERTIES=-p:BuildNumber=${{ github.run_number }} -p:CommitId=g${sha::7}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Atlassian.Mcp.Server.sln

      - name: Build
        run: dotnet build Atlassian.Mcp.Server.sln --configuration Release --no-restore ${{ env.VERSION_PROPERTIES }}

      - name: Test
        run: dotnet test Atlassian.Mcp.Server.sln --configuration Release --no-build --filter "TestCategory!=Integration"

      # Both packages are built from the same commit, so that the Publish workflow can release
      # either one. The release package is rebuilt so its assemblies carry the release version.
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/Atlassian.Mcp.Server --configuration Release --no-build ${{ env.VERSION_PROPERTIES }}
          dotnet pack src/Atlassian.Mcp.Server --configuration Release ${{ env.VERSION_PROPERTIES }} -p:Prerelease=false

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  draft-release:
    name: Create the draft release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: artifacts

      - name: Create the draft release and remove older drafts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_package=$(ls artifacts/*.nupkg | grep -v -- '-prerelease' | head -n 1)
          version=$(basename "$release_package" .nupkg | sed 's/^Atlassian\.Mcp\.Server\.//')
          tag="v$version"

          # Only the newest build is offered for publishing; older unpublished drafts are removed.
          for old in $(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName'); do
            gh release delete "$old" --yes
          done

          gh release create "$tag" artifacts/*.nupkg --draft --title "$tag" --generate-notes --target "$GITHUB_SHA"
          echo "Created draft release $tag. Run the Publish workflow to release it." >> "$GITHUB_STEP_SUMMARY"
