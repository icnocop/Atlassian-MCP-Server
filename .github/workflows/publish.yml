name: Publish

# Run by hand from the Actions tab. It asks whether to publish a GitHub pre-release as a NuGet
# prerelease, or to build a release from the same commit and publish it to NuGet and GitHub.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Publish as a prerelease or a release
        type: choice
        options:
          - prerelease
          - release
        default: prerelease
      pre-release:
        description: GitHub pre-release tag, such as v0.1.42-prerelease.g1a2b3c4 (leave empty for the newest)
        type: string
        required: false
      push-to-nuget:
        description: Push the package to NuGet
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish ${{ inputs.channel }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find the pre-release
        id: source
        shell: bash
        run: |
          tag="${{ inputs.pre-release }}"
          if [ -z "$tag" ]; then
            tag=$(gh release list --limit 100 --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | last | .tagName // empty')
          fi
          if [ -z "$tag" ]; then
            echo "::error::There is no GitHub pre-release to publish."
            exit 1
          fi

          version="${tag#v}"
          commit=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
          build_number=$(echo "$version" | sed -E 's/^[0-9]+\.[0-9]+\.([0-9]+).*/\1/')

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "build-number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Download the prerelease package
        if: inputs.channel == 'prerelease'
        run: gh release download "${{ steps.source.outputs.tag }}" --pattern "*.nupkg" --dir artifacts

      # The release is built from the pre-release's commit with the same build number and no suffix,
      # so that 0.1.42 and 0.1.42-prerelease.g1a2b3c4 hold the same code.
      - uses: actions/checkout@v5
        if: inputs.channel == 'release'
        with:
          ref: ${{ steps.source.outputs.commit }}

      - uses: actions/setup-dotnet@v5
        if: inputs.channel == 'release'
        with:
          global-json-file: global.json

      - name: Build, test, pack, and zip the release
        if: inputs.channel == 'release'
        run: |
          properties="-p:BuildNumber=${{ steps.source.outputs.build-number }} -p:Prerelease=false"
          dotnet build Atlassian.Mcp.Server.sln --configuration Release $properties
          dotnet test Atlassian.Mcp.Server.sln --configuration Release --no-build --filter "TestCategory!=Integration"
          dotnet pack src/Atlassian.Mcp.Server --configuration Release --no-build $properties
          version=$(basename "$(ls artifacts/*.nupkg | head -n 1)" .nupkg | sed 's/^Atlassian\.Mcp\.Server\.//')
          dotnet publish src/Atlassian.Mcp.Server --configuration Release --no-build $properties -p:UseAppHost=false --output publish
          (cd publish && zip -r -q "../artifacts/Atlassian.Mcp.Server.$version.zip" .)

      - name: Find the package
        id: package
        shell: bash
        run: |
          package=$(ls artifacts/*.nupkg | head -n 1)
          version=$(basename "$package" .nupkg | sed 's/^Atlassian\.Mcp\.Server\.//')
          echo "path=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The prerelease package is already on GitHub Packages; the Build workflow pushed it.
      - name: Push to GitHub Packages
        if: inputs.channel == 'release'
        run: dotnet nuget push "${{ steps.package.outputs.path }}" --api-key "${{ github.token }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      # NuGet trusted publishing exchanges the workflow's identity for a short-lived API key, so no
      # long-lived key is stored in the repository. NUGET_USER is the nuget.org account name.
      - name: Log in to NuGet
        id: nuget
        if: inputs.push-to-nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        if: inputs.push-to-nuget
        run: dotnet nuget push "${{ steps.package.outputs.path }}" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Publish the GitHub release
        if: inputs.channel == 'release'
        run: |
          tag="v${{ steps.package.outputs.version }}"
          gh release create "$tag" "${{ steps.package.outputs.path }}" artifacts/*.zip --latest --title "$tag" --generate-notes --target "${{ steps.source.outputs.commit }}"
          echo "Published the release $tag." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: inputs.channel == 'prerelease'
        run: echo "Pushed ${{ steps.package.outputs.version }} to NuGet." >> "$GITHUB_STEP_SUMMARY"
